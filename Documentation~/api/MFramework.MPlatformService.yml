  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 关闭平台服务并清空仍在等待的初始化回调；可以安全地重复调用。
  remarks: >-
    <xref href="MFramework.IMPlatformBridge" data-throw-if-not-resolved="false"></xref> 没有取消初始化的统一协议，因此本方法不会尝试中断桥接；

    桥接在关闭后触发的迟到回调会被安全忽略。
