  summary: 为玩法代码提供一个稳定入口，并把调用转发给选定的 <xref href="MFramework.IMPlatformBridge" data-throw-if-not-resolved="false"></xref>。
  remarks: >-
    平台桥接没有统一的取消协议。服务关闭时会清空仍在等待的初始化回调；

    如果桥接之后才返回结果，该迟到回调会被忽略。
  example: []
  syntax:
    content: 'public sealed class MPlatformService : IMFrameworkModule, IDisposable'
    content.vb: Public NotInheritable Class MPlatformService Implements IMFrameworkModule, IDisposable
