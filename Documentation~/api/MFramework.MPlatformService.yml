  nameWithType: MPlatformService.Initialize(Action<MPlatformInitializationResult>)
  fullName: MFramework.MPlatformService.Initialize(System.Action<MFramework.MPlatformInitializationResult>)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 初始化当前桥接，并合并同时发起的初始化请求。
  remarks: 桥接已经就绪时会立即执行回调。初始化失败后可以再次调用本方法进行重试。
  example: []
  syntax:
    content: public void Initialize(Action<MPlatformInitializationResult> completed)
    parameters:
    - id: completed
      type: System.Action{MFramework.MPlatformInitializationResult}
      description: 只调用一次的完成回调。回调异常会写入日志，确保其他等待者仍能收到结果。
    content.vb: Public Sub Initialize(completed As Action(Of MPlatformInitializationResult))
  overload: MFramework.MPlatformService.Initialize*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">completed</code> 为 null。
  - type: System.ObjectDisposedException
    commentId: T:System.ObjectDisposedException
    description: 服务已经关闭。
  nameWithType.vb: MPlatformService.Initialize(Action(Of MPlatformInitializationResult))
  fullName.vb: MFramework.MPlatformService.Initialize(System.Action(Of MFramework.MPlatformInitializationResult))
