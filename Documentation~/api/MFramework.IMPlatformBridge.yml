- uid: MFramework.IMPlatformBridge.Initialize(System.Action{MFramework.MPlatformInitializationResult})
  commentId: M:MFramework.IMPlatformBridge.Initialize(System.Action{MFramework.MPlatformInitializationResult})
  id: Initialize(System.Action{MFramework.MPlatformInitializationResult})
  parent: MFramework.IMPlatformBridge
  langs:
  - csharp
  - vb
  name: Initialize(Action<MPlatformInitializationResult>)
  nameWithType: IMPlatformBridge.Initialize(Action<MPlatformInitializationResult>)
  fullName: MFramework.IMPlatformBridge.Initialize(System.Action<MFramework.MPlatformInitializationResult>)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 开始初始化平台。
  remarks: >-
    第一版接口不要求桥接提供取消能力。<xref href="MFramework.MPlatformService" data-throw-if-not-resolved="false"></xref> 关闭后会清理等待者，

    并忽略桥接随后触发的迟到回调。
  example: []
  syntax:
    content: void Initialize(Action<MPlatformInitializationResult> completed)
    parameters:
    - id: completed
      type: System.Action{MFramework.MPlatformInitializationResult}
      description: 初始化结束时调用一次的回调，参数为成功或失败结果。
    content.vb: Sub Initialize(completed As Action(Of MPlatformInitializationResult))
  overload: MFramework.IMPlatformBridge.Initialize*
  nameWithType.vb: IMPlatformBridge.Initialize(Action(Of MPlatformInitializationResult))
  fullName.vb: MFramework.IMPlatformBridge.Initialize(System.Action(Of MFramework.MPlatformInitializationResult))
  name.vb: Initialize(Action(Of MPlatformInitializationResult))
