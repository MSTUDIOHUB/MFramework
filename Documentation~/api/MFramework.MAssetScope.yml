  name: MAssetScope
  nameWithType: MAssetScope
  fullName: MFramework.MAssetScope
  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 统一持有 Addressables 请求与租约，让页面、场景或玩法功能可以一次性释放相关资源。
  remarks: >-
    资源会按登记顺序的逆序释放。释放尚未完成的请求不会中止平台下载；框架会停止回调，

    并在 Addressables 完成后立即释放得到的结果。
  example: []
  syntax:
    content: 'public sealed class MAssetScope : IDisposable'
    content.vb: Public NotInheritable Class MAssetScope Implements IDisposable
