  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 串行执行一个可观察、可取消且拥有明确场景所有权的内容场景切换。
  remarks: >-
    MSceneFlow 只管理一个 Additive 内容场景；承载 MGameEntry 的 Bootstrap 场景必须常驻。

    Fade、输入锁、出生点、镜头和游戏模式等项目逻辑应注册为阶段命令。
  example: []
  syntax:
    content: 'public sealed class MSceneFlow : IMFrameworkModule, IMFrameworkTickable, IDisposable'
    content.vb: Public NotInheritable Class MSceneFlow Implements IMFrameworkModule, IMFrameworkTickable, IDisposable
