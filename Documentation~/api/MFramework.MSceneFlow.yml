  summary: 使用默认配置直接切换到指定目标场景（适合无需自定义阶段命令的快捷场景切换）。
  example: []
  syntax:
    content: public MSceneFlowRequest Transition(object targetKey, MSceneFlowOrder order = MSceneFlowOrder.LoadThenUnload)
    parameters:
    - id: targetKey
      type: System.Object
      description: 目标场景键（Addressables 地址或 AssetReference）。
    - id: order
      type: MFramework.MSceneFlowOrder
      description: 加载与卸载顺序；默认先加载后卸载。
    return:
      type: MFramework.MSceneFlowRequest
      description: 可观察或取消此次切换的请求。
