  summary: 注册、查询并校验具有明确类型的 ScriptableObject 配置项。
  remarks: >-
    MConfig 不负责加载文件、保存玩家进度或更新远端数据。请先通过选定的 Unity 资源方案

    加载配置资源，再将它们显式注册到这里。
