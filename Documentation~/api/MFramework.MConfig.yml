- uid: MFramework.MConfig.Register``1(``0)
  commentId: M:MFramework.MConfig.Register``1(``0)
  id: Register``1(``0)
  parent: MFramework.MConfig
  langs:
  - csharp
  - vb
  name: Register<TConfig>(TConfig)
  nameWithType: MConfig.Register<TConfig>(TConfig)
  fullName: MFramework.MConfig.Register<TConfig>(TConfig)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 使用调用时指定的泛型类型注册一个配置项。
  remarks: >-
    注册键是 <code class="typeparamref">TConfig</code> 与区分大小写的 ID，不是对象的运行时类型。

    查询和引用校验必须使用相同类型；不同注册类型可以使用相同 ID。

    注册时不执行引用校验，请在所有相关配置注册完成后调用 <xref href="MFramework.MConfig.ValidateAll" data-throw-if-not-resolved="false"></xref>。
  example: []
  syntax:
    content: 'public void Register<TConfig>(TConfig config) where TConfig : MConfigAsset'
    parameters:
    - id: config
      type: '{TConfig}'
      description: 要注册的配置项。
    typeParameters:
    - id: TConfig
      description: 调用方查询时使用的配置类型。
    content.vb: Public Sub Register(Of TConfig As MConfigAsset)(config As TConfig)
  overload: MFramework.MConfig.Register*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">config</code> 为 null。
  - type: MFramework.MConfigRegistrationException
    commentId: T:MFramework.MConfigRegistrationException
    description: 配置标识为空或重复。
  nameWithType.vb: MConfig.Register(Of TConfig)(TConfig)
  fullName.vb: MFramework.MConfig.Register(Of TConfig)(TConfig)
  name.vb: Register(Of TConfig)(TConfig)
