    parameters:
    - id: stage
      type: MFramework.MSceneFlowStage
      description: Before/After 或 Finally 命令点。
    - id: commandFactory
      type: System.Func{MFramework.MSceneFlowContext,MFramework.IMActionNode}
      description: 接收当前上下文并返回全新动作节点的工厂。
    - id: name
      type: System.String
      description: 可选诊断名称；省略时使用注册序号。
    return:
      type: MFramework.MSceneFlowPlan
      description: 当前计划，便于链式配置。
