- uid: MFramework.MEventBus.Subscribe``1(System.Action{``0},UnityEngine.Object)
  commentId: M:MFramework.MEventBus.Subscribe``1(System.Action{``0},UnityEngine.Object)
  id: Subscribe``1(System.Action{``0},UnityEngine.Object)
  parent: MFramework.MEventBus
  langs:
  - csharp
  - vb
  name: Subscribe<TEvent>(Action<TEvent>, Object)
  nameWithType: MEventBus.Subscribe<TEvent>(Action<TEvent>, Object)
  fullName: MFramework.MEventBus.Subscribe<TEvent>(System.Action<TEvent>, UnityEngine.Object)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 为指定事件类型订阅一个处理器。
  example: []
  syntax:
    content: public IDisposable Subscribe<TEvent>(Action<TEvent> handler, Object owner = null)
    parameters:
    - id: handler
      type: System.Action{{TEvent}}
      description: 发布事件时同步调用的回调。
    - id: owner
      type: UnityEngine.Object
      description: 可选的 Unity 所有者。所有者销毁后，该订阅会失效。
    typeParameters:
    - id: TEvent
      description: 事件载荷类型。
    return:
      type: System.IDisposable
      description: 订阅句柄；释放该句柄时会移除订阅。
    content.vb: Public Function Subscribe(Of TEvent)(handler As Action(Of TEvent), owner As [Object] = Nothing) As IDisposable
  overload: MFramework.MEventBus.Subscribe*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">handler</code> 为 null。
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: 该方法由非创建线程调用。
