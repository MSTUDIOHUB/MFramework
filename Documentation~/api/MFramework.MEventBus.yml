  name: MEventBus
  nameWithType: MEventBus
  fullName: MFramework.MEventBus
  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 实现一个同步、类型安全、零装箱，并支持释放订阅的事件总线。
  remarks: >-
    该实现只能在创建它的线程中使用，通常是 Unity 主线程。

    发布事件时会遍历泛型通道的稳定快照，因此既消除了值类型事件装箱，也可以安全地在发布期间增删订阅。
  example: []
  syntax:
    content: 'public sealed class MEventBus : IMEventBus, IMFrameworkModule'
    content.vb: Public NotInheritable Class MEventBus Implements IMEventBus, IMFrameworkModule
  inheritance:
  - System.Object
  implements:
