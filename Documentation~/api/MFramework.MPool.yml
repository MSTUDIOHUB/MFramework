  name: MPool
  nameWithType: MPool
  fullName: MFramework.MPool
  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 复用显式注册的 GameObject 预制体，减少重复 Instantiate 与 Destroy 的开销。
  remarks: >-
    每项注册的闲置实例由 Unity 官方 <xref href="UnityEngine.Pool.ObjectPool%601" data-throw-if-not-resolved="false"></xref> 保存；MFramework 只补充预制体注册、

    实例归属校验和缓存的 <xref href="MFramework.IMPooledGameObject" data-throw-if-not-resolved="false"></xref> 生命周期回调。此类不池化任意 C# 对象。

    释放持有已注册预制体的 Addressables Lease 前，必须先调用 <xref href="MFramework.MPool.Clear(MFramework.MPoolKey)" data-throw-if-not-resolved="false"></xref>。
  example: []
  syntax:
    content: 'public sealed class MPool : IMPool, IMFrameworkModule, IDisposable'
    content.vb: Public NotInheritable Class MPool Implements IMPool, IMFrameworkModule, IDisposable
  inheritance:
