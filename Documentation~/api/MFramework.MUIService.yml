  name: MUIService
  nameWithType: MUIService
  fullName: MFramework.MUIService
  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 为每个显式注册的视图类型创建并缓存一个 UGUI 实例。
  remarks: >-
    MUIService 管理视图生命周期与层级；页面和弹窗导航请使用 <xref href="MFramework.MUIRouter" data-throw-if-not-resolved="false"></xref>。

    所有注册均为显式注册，不使用程序集扫描或基于反射的构造方式。
  example: []
  syntax:
    content: 'public sealed class MUIService : IMFrameworkModule, IDisposable'
    content.vb: Public NotInheritable Class MUIService Implements IMFrameworkModule, IDisposable
