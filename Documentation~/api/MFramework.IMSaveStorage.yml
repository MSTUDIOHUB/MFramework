  name: IMSaveStorage
  nameWithType: IMSaveStorage
  fullName: MFramework.IMSaveStorage
  type: Interface
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: >-
    可替换的完整快照后端。MSave 会在 GetSynchronizationRoot 返回的锁内完成读取、CAS 与发布。

    实现不得在 Read 中隐藏错误，也不得在 Commit 中用不安全的删除后移动模拟原子替换。
  example: []
  syntax:
    content: public interface IMSaveStorage
    content.vb: Public Interface IMSaveStorage
  derivedClasses:
  - MFramework.MFileSaveStorage
- uid: MFramework.IMSaveStorage.GetSynchronizationRoot(System.String)
  commentId: M:MFramework.IMSaveStorage.GetSynchronizationRoot(System.String)
  id: GetSynchronizationRoot(System.String)
  parent: MFramework.IMSaveStorage
  langs:
  - csharp
  - vb
  name: GetSynchronizationRoot(string)
  nameWithType: IMSaveStorage.GetSynchronizationRoot(string)
  fullName: MFramework.IMSaveStorage.GetSynchronizationRoot(string)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 获取稳定的进程内槽锁；访问同一物理槽的所有后端实例必须返回同一对象。
  example: []
  syntax:
    content: object GetSynchronizationRoot(string slot)
    parameters:
    - id: slot
      type: System.String
      description: 经过 MSave 验证的槽名。
    return:
      type: System.Object
      description: 非 null 的锁对象，其生命周期必须覆盖同槽所有操作。
    content.vb: Function GetSynchronizationRoot(slot As String) As Object
  overload: MFramework.IMSaveStorage.GetSynchronizationRoot*
  nameWithType.vb: IMSaveStorage.GetSynchronizationRoot(String)
  fullName.vb: MFramework.IMSaveStorage.GetSynchronizationRoot(String)
  name.vb: GetSynchronizationRoot(String)
- uid: MFramework.IMSaveStorage.Read(System.String,MFramework.MSaveSource)
  commentId: M:MFramework.IMSaveStorage.Read(System.String,MFramework.MSaveSource)
  id: Read(System.String,MFramework.MSaveSource)
  parent: MFramework.IMSaveStorage
  langs:
  - csharp
  - vb
  name: Read(string, MSaveSource)
  nameWithType: IMSaveStorage.Read(string, MSaveSource)
  fullName: MFramework.IMSaveStorage.Read(string, MFramework.MSaveSource)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 读取已发布快照的完整字节；只在目标确实不存在时返回 null。
  example: []
  syntax:
    content: byte[] Read(string slot, MSaveSource source)
    parameters:
    - id: slot
      type: System.String
      description: 槽名。
    - id: source
      type: MFramework.MSaveSource
      description: 显式选择主档或备份。
    return:
      type: System.Byte[]
      description: 独立字节数组，或代表不存在的 null；不得返回内部可变缓冲区。
    content.vb: Function Read(slot As String, source As MSaveSource) As Byte()
  overload: MFramework.IMSaveStorage.Read*
  exceptions:
  - type: MFramework.MSaveStorageException
    commentId: T:MFramework.MSaveStorageException
    description: 存储读取失败，不能伪装成不存在。
  nameWithType.vb: IMSaveStorage.Read(String, MSaveSource)
  fullName.vb: MFramework.IMSaveStorage.Read(String, MFramework.MSaveSource)
