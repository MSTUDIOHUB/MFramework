  summary: 创建存档服务；不会立即读取磁盘，也不会自动注册为全局框架模块。
  example: []
  syntax:
    content: public MSave(IMSaveStorage storage, IMSaveSerializer<T> serializer, int schemaVersion = 1, string contentVersion = "", IEnumerable<IMSaveMigration> migrations = null)
    parameters:
    - id: storage
      type: MFramework.IMSaveStorage
      description: 持久化后端，不能为 null。
    - id: serializer
      type: MFramework.IMSaveSerializer{{T}}
      description: 当前结构版本的序列化策略，不能为 null。
    - id: schemaVersion
      type: System.Int32
      description: 当前业务结构版本，必须大于零。
    - id: contentVersion
      type: System.String
      description: 内容版本元数据，例如配置表版本。
    - id: migrations
      type: System.Collections.Generic.IEnumerable{MFramework.IMSaveMigration}
      description: 可选的逐版本迁移步骤；同一起始版本不能重复。
