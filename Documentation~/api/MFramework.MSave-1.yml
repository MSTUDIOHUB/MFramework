  name: RestoreBackup(MSaveRecoveryToken)
  nameWithType: MSave<T>.RestoreBackup(MSaveRecoveryToken)
  fullName: MFramework.MSave<T>.RestoreBackup(MFramework.MSaveRecoveryToken)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 使用 <xref href="MFramework.MSave%601.LoadBackup(System.String)" data-throw-if-not-resolved="false"></xref> 签发的恢复凭据，将已检查的备份恢复为新的主档修订，同时保留该有效备份。
