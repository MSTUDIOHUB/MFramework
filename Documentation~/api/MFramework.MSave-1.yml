- uid: MFramework.MSave`1.SaveOrOverwrite(System.String,`0)
  commentId: M:MFramework.MSave`1.SaveOrOverwrite(System.String,`0)
  id: SaveOrOverwrite(System.String,`0)
  parent: MFramework.MSave`1
  langs:
  - csharp
