  name: SaveOrOverwrite(string, T)
  nameWithType: MSave<T>.SaveOrOverwrite(string, T)
  fullName: MFramework.MSave<T>.SaveOrOverwrite(string, T)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 直接保存或覆盖指定槽位的完整快照（适合单人独立游戏的便捷保存入口，无需手动传递上一版本的 Metadata）。
  example: []
  syntax:
    content: public MSaveResult<T> SaveOrOverwrite(string slot, T value)
    parameters:
    - id: slot
      type: System.String
      description: 合法槽名。
    - id: value
      type: '{T}'
      description: 要保存的完整快照。
    return:
      type: MFramework.MSaveResult{{T}}
      description: 保存结果回执。
    content.vb: Public Function SaveOrOverwrite(slot As String, value As T) As MSaveResult(Of T)
  overload: MFramework.MSave`1.SaveOrOverwrite*
