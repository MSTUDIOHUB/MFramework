- uid: MFramework.MSave`1.Save(System.String,`0,MFramework.MSaveMetadata)
  commentId: M:MFramework.MSave`1.Save(System.String,`0,MFramework.MSaveMetadata)
  id: Save(System.String,`0,MFramework.MSaveMetadata)
  parent: MFramework.MSave`1
  langs:
  - csharp
  - vb
  name: Save(string, T, MSaveMetadata)
  nameWithType: MSave<T>.Save(string, T, MSaveMetadata)
  fullName: MFramework.MSave<T>.Save(string, T, MFramework.MSaveMetadata)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: >-
    将完整快照作为下一修订发布。默认 expected=null 仅允许创建全新槽；

    更新已有存档时传入最近一次 Load 或 Save 成功结果的 Metadata（乐观并发控制）。
  example: []
  syntax:
    content: public MSaveResult<T> Save(string slot, T value, MSaveMetadata expected = null)
    parameters:
    - id: slot
      type: System.String
      description: 合法槽名。
    - id: value
      type: '{T}'
      description: 应用已经构造完成的完整快照。
    - id: expected
      type: MFramework.MSaveMetadata
      description: 预期主档的元数据凭据；null 表示创建新槽。
    return:
      type: MFramework.MSaveResult{{T}}
      description: 成功、冲突或明确失败回执。
    content.vb: Public Function Save(slot As String, value As T, expected As MSaveMetadata = Nothing) As MSaveResult(Of T)
  overload: MFramework.MSave`1.Save*
