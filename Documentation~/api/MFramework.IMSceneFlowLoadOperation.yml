items:
- uid: MFramework.IMSceneFlowLoadOperation
  commentId: T:MFramework.IMSceneFlowLoadOperation
  id: IMSceneFlowLoadOperation
  parent: MFramework
  children:
  - MFramework.IMSceneFlowLoadOperation.TakeScene
  langs:
  - csharp
  - vb
  name: IMSceneFlowLoadOperation
  nameWithType: IMSceneFlowLoadOperation
  fullName: MFramework.IMSceneFlowLoadOperation
  type: Interface
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 表示一次尚未转移目标场景所有权的加载操作。
  remarks: >-
    在调用 <xref href="MFramework.IMSceneFlowLoadOperation.TakeScene" data-throw-if-not-resolved="false"></xref> 前释放本操作，表示调用方永久放弃加载结果。即使底层加载

    稍后成功，后端也必须继续持有并最终释放该场景，不能把所有权留给已经结束的 MSceneFlow。
  example: []
  syntax:
    content: 'public interface IMSceneFlowLoadOperation : IMSceneFlowOperation, IDisposable'
    content.vb: Public Interface IMSceneFlowLoadOperation Inherits IMSceneFlowOperation, IDisposable
  inheritedMembers:
  - MFramework.IMSceneFlowOperation.IsDone
  - MFramework.IMSceneFlowOperation.Progress
  - MFramework.IMSceneFlowOperation.Failure
  - MFramework.IMSceneFlowOperation.Dispose
  extensionMethods:
  - MFramework.IMSceneFlowLoadOperation.MFramework.MDisposableExtensions.AddTo``1(MFramework.MAssetScope)
  - MFramework.IMSceneFlowLoadOperation.MFramework.MDisposableExtensions.AddTo``1(MFramework.MDisposableBag)
- uid: MFramework.IMSceneFlowLoadOperation.TakeScene
  commentId: M:MFramework.IMSceneFlowLoadOperation.TakeScene
  id: TakeScene
  parent: MFramework.IMSceneFlowLoadOperation
  langs:
  - csharp
  - vb
  name: TakeScene()
  nameWithType: IMSceneFlowLoadOperation.TakeScene()
  fullName: MFramework.IMSceneFlowLoadOperation.TakeScene()
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 在成功完成后把场景所有权转移给 MSceneFlow；只能调用一次。
  example: []
  syntax:
    content: IMSceneFlowScene TakeScene()
    return:
      type: MFramework.IMSceneFlowScene
      description: 由调用方负责最终释放的场景对象。
    content.vb: Function TakeScene() As IMSceneFlowScene
  overload: MFramework.IMSceneFlowLoadOperation.TakeScene*
