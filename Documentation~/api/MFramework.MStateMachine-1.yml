  summary: 使用同一个共享上下文运行显式注册的状态。
  remarks: >-
    状态按照泛型类型显式注册。状态机只把 <xref href="System.Type" data-throw-if-not-resolved="false"></xref> 用作字典键，

    不会扫描程序集、通过反射创建状态，也不会按名称调用成员。
  example: []
  syntax:
    content: 'public sealed class MStateMachine<TContext> : IDisposable'
    typeParameters:
    - id: TContext
      description: 传给每个状态回调的共享数据与服务类型。
