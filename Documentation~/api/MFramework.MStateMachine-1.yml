  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 退出当前状态，并进入一个已注册的状态。
  remarks: >-
    不允许在 Enter 或 Exit 中递归调用该方法。请在后续 Tick 中请求下一次切换，

    使生命周期顺序保持清晰、可预测。
  example: []
  syntax:
    content: 'public bool ChangeState<TState>() where TState : class, IMState<TContext>'
    typeParameters:
    - id: TState
      description: 已注册的目标状态类型。
    return:
      type: System.Boolean
      description: >-
        成功切换状态时返回 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>；请求的状态已经是当前状态时返回

        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>。
    content.vb: Public Function ChangeState(Of TState As {Class, IMState(Of TContext)})() As Boolean
  overload: MFramework.MStateMachine`1.ChangeState*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: 请求的状态尚未注册，或另一次状态切换正在进行。
  nameWithType.vb: MStateMachine(Of TContext).ChangeState(Of TState)()
  fullName.vb: MFramework.MStateMachine(Of TContext).ChangeState(Of TState)()
  name.vb: ChangeState(Of TState)()
