  summary: 使用固定 PCG-XSH-RR 64/32 算法提供可恢复的独立随机流。
  remarks: >-
    同一初始状态、同一调用顺序和同一版本产生相同结果；不同抽样方法消耗的输出数量可能不同。

    本类型不是密码学随机数生成器，不提供防作弊、线程安全或持久化保证。

    调用方负责串行访问，并把捕获状态与对应业务结果一同提交。
  example: []
  syntax:
    content: 'public sealed class MRandom : IMRandomSource'
    content.vb: Public NotInheritable Class MRandom Implements IMRandomSource
  inheritance:
  - System.Object
  implements:
