- uid: MFramework.MRandom.CreateStream(System.UInt64,System.String)
  commentId: M:MFramework.MRandom.CreateStream(System.UInt64,System.String)
  id: CreateStream(System.UInt64,System.String)
  parent: MFramework.MRandom
  langs:
  - csharp
  - vb
  name: CreateStream(ulong, string)
  nameWithType: MRandom.CreateStream(ulong, string)
  fullName: MFramework.MRandom.CreateStream(ulong, string)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 从主种子和稳定名称派生一个互不共享可变状态的随机流。
  remarks: >-
    派生不读取也不推进任何已有生成器。名称按 UTF-16 码元的小端字节使用 FNV-1a 64 位散列，

    不使用运行时的 string.GetHashCode。散列不保证不同名称永不碰撞，也不保证流之间密码学独立。
  example: []
  syntax:
    content: public static MRandom CreateStream(ulong seed, string streamName)
    parameters:
    - id: seed
      type: System.UInt64
      description: 由应用保存的主种子。
    - id: streamName
      type: System.String
      description: 非空且非全空白的稳定名称，区分大小写，不进行 Unicode 规范化。
    return:
      type: MFramework.MRandom
      description: 新生成器；相同种子、名称及版本得到相同序列。
    content.vb: Public Shared Function CreateStream(seed As ULong, streamName As String) As MRandom
  overload: MFramework.MRandom.CreateStream*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: 名称为 null、空字符串或全部为空白。
  nameWithType.vb: MRandom.CreateStream(ULong, String)
  fullName.vb: MFramework.MRandom.CreateStream(ULong, String)
  name.vb: CreateStream(ULong, String)
