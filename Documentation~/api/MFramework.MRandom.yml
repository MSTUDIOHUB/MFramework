- uid: MFramework.MRandom.#ctor(System.UInt64,System.UInt64)
  commentId: M:MFramework.MRandom.#ctor(System.UInt64,System.UInt64)
  id: '#ctor(System.UInt64,System.UInt64)'
  parent: MFramework.MRandom
  langs:
  - csharp
  - vb
  name: MRandom(ulong, ulong)
  nameWithType: MRandom.MRandom(ulong, ulong)
  fullName: MFramework.MRandom.MRandom(ulong, ulong)
  type: Constructor
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 按照 PCG 标准播种过程创建一个随机流。
  remarks: 显式限制流编号，避免左移时丢弃最高位，导致两个输入悄悄映射到同一增量。
  example: []
  syntax:
    content: public MRandom(ulong seed, ulong sequence = 54)
    parameters:
    - id: seed
      type: System.UInt64
      description: 初始种子，接受所有 64 位无符号整数。
    - id: sequence
      type: System.UInt64
      description: 流编号，范围为 [0, 2^63 - 1]；默认值为 54。
    content.vb: Public Sub New(seed As ULong, sequence As ULong = 54)
  overload: MFramework.MRandom.#ctor*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: 流编号超出 63 位可表示范围。
  nameWithType.vb: MRandom.New(ULong, ULong)
  fullName.vb: MFramework.MRandom.New(ULong, ULong)
  name.vb: New(ULong, ULong)
