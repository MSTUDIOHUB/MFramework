  summary: >-
    使用 Unity JsonUtility 的快照序列化适配器；T 必须是符合 Unity 字段序列化规则的普通可序列化类。

    不支持直接保存 MonoBehaviour、ScriptableObject、字典或任意多态对象图；业务约束需另行验证。
