  namespace: MFramework
  summary: 在不隐藏 Addressables 运行时键模型的前提下，提供轻量且生命周期安全的辅助 API。
  remarks: >-
    此封装补充了明确的资源归属、加载进度、可读错误和停止回调能力，同时刻意在公开 API 中

    保留 Addressables 的 AssetReference 与键，使官方文档和已有知识仍然适用。
