  summary: 通过 Addressables 加载场景。
  example: []
  syntax:
    content: public static MSceneLoadRequest LoadSceneAsync(object key, LoadSceneMode loadMode = LoadSceneMode.Single, bool activateOnLoad = true, int priority = 100, MAssetScope scope = null)
    parameters:
    - id: key
      type: System.Object
      description: 场景地址或运行时键。
    - id: loadMode
      type: UnityEngine.SceneManagement.LoadSceneMode
