  summary: 通过地址、可作为键使用的标签或运行时键加载资源。
  example: []
  syntax:
    content: 'public static MAssetLoadRequest<TAsset> LoadAssetAsync<TAsset>(object key, MAssetScope scope = null) where TAsset : Object'
