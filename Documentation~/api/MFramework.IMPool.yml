- uid: MFramework.IMPool.Register(MFramework.MPoolKey,UnityEngine.GameObject,System.Int32)
  commentId: M:MFramework.IMPool.Register(MFramework.MPoolKey,UnityEngine.GameObject,System.Int32)
  id: Register(MFramework.MPoolKey,UnityEngine.GameObject,System.Int32)
  parent: MFramework.IMPool
  langs:
  - csharp
  - vb
  name: Register(MPoolKey, GameObject, int)
  nameWithType: IMPool.Register(MPoolKey, GameObject, int)
  fullName: MFramework.IMPool.Register(MFramework.MPoolKey, UnityEngine.GameObject, int)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 注册预制体。预制体必须先注册，之后才能预热或生成。
  example: []
  syntax:
    content: void Register(MPoolKey key, GameObject prefab, int maxInactive = 0)
    parameters:
    - id: key
      type: MFramework.MPoolKey
      description: 后续操作使用的稳定 Key。
    - id: prefab
      type: UnityEngine.GameObject
      description: 需要实例化的 GameObject 预制体。
    - id: maxInactive
      type: System.Int32
      description: 最多保留的闲置实例数量；零表示不限制闲置数量。
    content.vb: Sub Register(key As MPoolKey, prefab As GameObject, maxInactive As Integer = 0)
  overload: MFramework.IMPool.Register*
  nameWithType.vb: IMPool.Register(MPoolKey, GameObject, Integer)
  fullName.vb: MFramework.IMPool.Register(MFramework.MPoolKey, UnityEngine.GameObject, Integer)
  name.vb: Register(MPoolKey, GameObject, Integer)
