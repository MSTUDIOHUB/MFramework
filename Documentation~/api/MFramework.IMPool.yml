- uid: MFramework.IMPool.Spawn(MFramework.MPoolKey,UnityEngine.Vector3,UnityEngine.Quaternion,UnityEngine.Transform)
  commentId: M:MFramework.IMPool.Spawn(MFramework.MPoolKey,UnityEngine.Vector3,UnityEngine.Quaternion,UnityEngine.Transform)
  id: Spawn(MFramework.MPoolKey,UnityEngine.Vector3,UnityEngine.Quaternion,UnityEngine.Transform)
  parent: MFramework.IMPool
  langs:
  - csharp
  - vb
  name: Spawn(MPoolKey, Vector3, Quaternion, Transform)
  nameWithType: IMPool.Spawn(MPoolKey, Vector3, Quaternion, Transform)
  fullName: MFramework.IMPool.Spawn(MFramework.MPoolKey, UnityEngine.Vector3, UnityEngine.Quaternion, UnityEngine.Transform)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 获取并激活一个已注册预制体的实例。
  example: []
  syntax:
    content: GameObject Spawn(MPoolKey key, Vector3 position, Quaternion rotation, Transform parent = null)
    parameters:
    - id: key
      type: MFramework.MPoolKey
      description: 已注册预制体的 Key。
    - id: position
      type: UnityEngine.Vector3
      description: 生命周期回调执行前设置的世界坐标。
    - id: rotation
      type: UnityEngine.Quaternion
      description: 生命周期回调执行前设置的世界旋转。
    - id: parent
      type: UnityEngine.Transform
      description: 为实例设置的可选父级。
    return:
      type: UnityEngine.GameObject
      description: 已激活的对象池 GameObject。
    content.vb: Function Spawn(key As MPoolKey, position As Vector3, rotation As Quaternion, parent As Transform = Nothing) As GameObject
  overload: MFramework.IMPool.Spawn*
