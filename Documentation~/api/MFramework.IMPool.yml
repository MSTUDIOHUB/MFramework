  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 确保至少准备好 <code class="paramref">count</code> 个闲置实例。
  example: []
  syntax:
    content: void Prewarm(MPoolKey key, int count)
    parameters:
    - id: key
      type: MFramework.MPoolKey
      description: 已注册预制体的 Key。
    - id: count
      type: System.Int32
      description: 目标闲置实例数量。
    content.vb: Sub Prewarm(key As MPoolKey, count As Integer)
