  type: Field
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 离开当前弹窗或返回页面栈的上一页。
  remarks: >-
    弹窗未处理时默认以取消结果关闭；页面未处理时默认返回一级页面历史。

    此枚举值固定为 4，以免改变 Prefab 中已经序列化的其他操作数值。
  example: []
  syntax:
    content: Back = 4
    return:
      type: MFramework.MUIAction
