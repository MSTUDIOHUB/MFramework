  name: MUIRouter
  nameWithType: MUIRouter
  fullName: MFramework.MUIRouter
  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 协调缓存的 UGUI 页面、模态弹窗、通用按钮以及统一返回行为。
  remarks: >-
    导航操作不会同步重入。视图生命周期钩子抛出异常时，路由器会先恢复一致的可见状态与栈状态，

    再把原异常交还给调用方；回滚阶段也失败时会抛出 <xref href="System.AggregateException" data-throw-if-not-resolved="false"></xref>。
  example: []
  syntax:
    content: 'public sealed class MUIRouter : IMFrameworkModule, IDisposable'
    content.vb: Public NotInheritable Class MUIRouter Implements IMFrameworkModule, IDisposable
  inheritance:
  - System.Object
  implements:
  - MFramework.IMFrameworkModule
  - System.IDisposable
  inheritedMembers:
