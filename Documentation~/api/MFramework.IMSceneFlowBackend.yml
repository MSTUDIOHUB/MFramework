  fullName: MFramework.IMSceneFlowBackend.LoadAsync(object, int)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 以 Additive 且暂不激活的方式开始加载目标内容场景。
  remarks: >-
    返回的操作必须遵守 <xref href="MFramework.IMSceneFlowLoadOperation" data-throw-if-not-resolved="false"></xref> 的放弃契约：在场景所有权

    转移前被释放时，后端负责处理并最终释放任何迟到的成功结果。
  example: []
  syntax:
    content: IMSceneFlowLoadOperation LoadAsync(object key, int priority)
    parameters:
    - id: key
      type: System.Object
    - id: priority
      type: System.Int32
    return:
      type: MFramework.IMSceneFlowLoadOperation
    content.vb: Function LoadAsync(key As Object, priority As Integer) As IMSceneFlowLoadOperation
