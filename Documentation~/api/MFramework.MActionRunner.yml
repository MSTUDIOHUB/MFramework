- uid: MFramework.MActionRunner.Run(MFramework.IMActionNode,UnityEngine.Object,MFramework.MTimeMode)
  commentId: M:MFramework.MActionRunner.Run(MFramework.IMActionNode,UnityEngine.Object,MFramework.MTimeMode)
  id: Run(MFramework.IMActionNode,UnityEngine.Object,MFramework.MTimeMode)
  parent: MFramework.MActionRunner
  langs:
  - csharp
  - vb
  name: Run(IMActionNode, Object, MTimeMode)
  nameWithType: MActionRunner.Run(IMActionNode, Object, MTimeMode)
  fullName: MFramework.MActionRunner.Run(MFramework.IMActionNode, UnityEngine.Object, MFramework.MTimeMode)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 启动一个根动作。
  example: []
  syntax:
    content: public MActionHandle Run(IMActionNode node, Object owner = null, MTimeMode timeMode = MTimeMode.Scaled)
    parameters:
    - id: node
      type: MFramework.IMActionNode
      description: 新创建的单次使用动作节点。
    - id: owner
      type: UnityEngine.Object
      description: 可选的 Unity 对象。该对象销毁后，动作会在运行器下一次 Tick 时被取消。
    - id: timeMode
      type: MFramework.MTimeMode
      description: 推进该动作时使用的帧时间模式。
    return:
      type: MFramework.MActionHandle
      description: 用于观察或取消动作的句柄。
    content.vb: Public Function Run(node As IMActionNode, owner As [Object] = Nothing, timeMode As MTimeMode = MTimeMode.Scaled) As MActionHandle
  overload: MFramework.MActionRunner.Run*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">node</code> 为 null。
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: 运行器已经关闭，或节点不是新创建的节点。
