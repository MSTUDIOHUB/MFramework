  namespace: MFramework
  summary: 持有并推进根动作节点。
  remarks: >-
    请向 <xref href="MFramework.MFrameworkApp" data-throw-if-not-resolved="false"></xref> 注册一个运行器。在某次 Tick 期间启动的动作会立即开始，

    但要到下一帧才会首次获得时间更新。
  example: []
  syntax:
    content: 'public sealed class MActionRunner : IMFrameworkModule, IMFrameworkTickable, IDisposable'
