- uid: MFramework.MSceneLease.UnloadAsync(UnityEngine.SceneManagement.UnloadSceneOptions)
  commentId: M:MFramework.MSceneLease.UnloadAsync(UnityEngine.SceneManagement.UnloadSceneOptions)
  id: UnloadAsync(UnityEngine.SceneManagement.UnloadSceneOptions)
  parent: MFramework.MSceneLease
  langs:
  - csharp
  - vb
  name: UnloadAsync(UnloadSceneOptions)
  nameWithType: MSceneLease.UnloadAsync(UnloadSceneOptions)
  fullName: MFramework.MSceneLease.UnloadAsync(UnityEngine.SceneManagement.UnloadSceneOptions)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 开始卸载场景，并返回可观察进度、错误与完成状态的请求。
  remarks: >-
    Addressables 不能直接卸载尚未激活的场景，因此请求会在必要时先完成激活，再执行卸载。

    第一次调用提供的 <code class="paramref">options</code> 生效；后续调用复用同一个请求。
  example: []
  syntax:
    content: public MSceneUnloadRequest UnloadAsync(UnloadSceneOptions options = UnloadSceneOptions.None)
    parameters:
    - id: options
      type: UnityEngine.SceneManagement.UnloadSceneOptions
      description: Unity 场景卸载选项。
    return:
      type: MFramework.MSceneUnloadRequest
      description: 唯一的场景卸载请求。
    content.vb: Public Function UnloadAsync(options As UnloadSceneOptions = UnloadSceneOptions.None) As MSceneUnloadRequest
  overload: MFramework.MSceneLease.UnloadAsync*
