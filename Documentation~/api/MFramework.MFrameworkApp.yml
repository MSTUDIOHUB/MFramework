  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 使用接口或具体服务类型作为键注册一个服务。
  example: []
  syntax:
    content: 'public MFrameworkApp Register<TService>(TService service) where TService : class'
    parameters:
    - id: service
      type: '{TService}'
      description: 要注册的服务实例，不能为 null。
    typeParameters:
    - id: TService
      description: 调用方获取服务时使用的类型键。
    return:
      type: MFramework.MFrameworkApp
      description: 当前框架应用，便于在启动代码中链式注册。
    content.vb: Public Function Register(Of TService As Class)(service As TService) As MFrameworkApp
  overload: MFramework.MFrameworkApp.Register*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">service</code> 为 null。
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: 注册阶段已经结束，或该类型键已经注册。
  nameWithType.vb: MFrameworkApp.Register(Of TService)(TService)
  fullName.vb: MFramework.MFrameworkApp.Register(Of TService)(TService)
