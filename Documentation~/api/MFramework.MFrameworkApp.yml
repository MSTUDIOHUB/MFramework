  name: MFrameworkApp
  nameWithType: MFrameworkApp
  fullName: MFramework.MFrameworkApp
  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 持有框架服务，并驱动它们的显式生命周期。
  remarks: >-
    服务按照注册顺序初始化，并按照相反顺序关闭。

    所有注册均为显式操作；该类型不会扫描程序集，也不会通过反射创建服务。
