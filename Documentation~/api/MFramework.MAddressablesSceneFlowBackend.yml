- uid: MFramework.MAddressablesSceneFlowBackend.UnloadAsync(MFramework.IMSceneFlowScene)
  commentId: M:MFramework.MAddressablesSceneFlowBackend.UnloadAsync(MFramework.IMSceneFlowScene)
  id: UnloadAsync(MFramework.IMSceneFlowScene)
  parent: MFramework.MAddressablesSceneFlowBackend
  langs:
  - csharp
  - vb
  name: UnloadAsync(IMSceneFlowScene)
  nameWithType: MAddressablesSceneFlowBackend.UnloadAsync(IMSceneFlowScene)
  fullName: MFramework.MAddressablesSceneFlowBackend.UnloadAsync(MFramework.IMSceneFlowScene)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: >-
    开始卸载场景。操作运行期间调用方不得释放场景；成功后后端完成所有权交还，

    失败时场景仍归调用方持有，可再次释放或重试。
  remarks: >-
    若运行中的操作被 Dispose，后端仍必须负责让已经发起的底层卸载安全收口；此时场景

    不会归还给调用方。只有可观察操作以 Failed 终态完成时，所有权才归还调用方。

    本方法还必须以返回值作为原子所有权边界：抛出异常或返回 null 时不得已经发起卸载，

    场景仍归调用方；一旦返回非 null 操作，运行期间及操作被提前释放后的收口均归后端。
  example: []
  syntax:
    content: public IMSceneFlowOperation UnloadAsync(IMSceneFlowScene scene)
    parameters:
    - id: scene
      type: MFramework.IMSceneFlowScene
    return:
      type: MFramework.IMSceneFlowOperation
    content.vb: Public Function UnloadAsync(scene As IMSceneFlowScene) As IMSceneFlowOperation
  overload: MFramework.MAddressablesSceneFlowBackend.UnloadAsync*
  implements:
  - MFramework.IMSceneFlowBackend.UnloadAsync(MFramework.IMSceneFlowScene)
