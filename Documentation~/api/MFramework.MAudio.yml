- uid: MFramework.MAudio.Register(MFramework.MAudioId,UnityEngine.AudioClip,System.Single,System.Int32)
  commentId: M:MFramework.MAudio.Register(MFramework.MAudioId,UnityEngine.AudioClip,System.Single,System.Int32)
  id: Register(MFramework.MAudioId,UnityEngine.AudioClip,System.Single,System.Int32)
  parent: MFramework.MAudio
  langs:
  - csharp
  - vb
  name: Register(MAudioId, AudioClip, float, int)
  nameWithType: MAudio.Register(MAudioId, AudioClip, float, int)
  fullName: MFramework.MAudio.Register(MFramework.MAudioId, UnityEngine.AudioClip, float, int)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 注册 AudioClip。音频必须先注册，之后才能播放。
  example: []
  syntax:
    content: public void Register(MAudioId id, AudioClip clip, float minimumIntervalSeconds = 0, int maxConcurrentInstances = 0)
    parameters:
    - id: id
      type: MFramework.MAudioId
      description: 玩法代码使用的稳定 ID。
    - id: clip
      type: UnityEngine.AudioClip
      description: 需要注册的 AudioClip；MAudio 不持有其资源所有权，也不会释放它。
    - id: minimumIntervalSeconds
      type: System.Single
      description: 此 ID 两次成功播放 SFX 之间所需的最短真实时间间隔。
    - id: maxConcurrentInstances
      type: System.Int32
      description: 此 ID 可同时占用的最大 SFX 声部数；零表示只使用全局上限。
    content.vb: Public Sub Register(id As MAudioId, clip As AudioClip, minimumIntervalSeconds As Single = 0, maxConcurrentInstances As Integer = 0)
  overload: MFramework.MAudio.Register*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: 当 <code class="paramref">id</code> 无效时抛出。
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: 当 <code class="paramref">clip</code> 为 null 时抛出。
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: 当时间间隔或单 ID 并发上限为负数时抛出。
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: 当 ID 已经注册时抛出。
  nameWithType.vb: MAudio.Register(MAudioId, AudioClip, Single, Integer)
  fullName.vb: MFramework.MAudio.Register(MFramework.MAudioId, UnityEngine.AudioClip, Single, Integer)
  name.vb: Register(MAudioId, AudioClip, Single, Integer)
