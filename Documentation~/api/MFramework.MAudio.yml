  name: MAudio
  nameWithType: MAudio
  fullName: MFramework.MAudio
  type: Class
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 使用已注册的 AudioClip 播放一路 BGM，以及数量受限的并发 SFX。
  remarks: >-
    调用方拥有宿主 GameObject；本服务会添加并持有自己的 AudioSource 组件，

    并在 <xref href="MFramework.MAudio.Dispose" data-throw-if-not-resolved="false"></xref> 时移除这些组件。本服务不负责加载或释放 AudioClip。
  example: []
  syntax:
    content: 'public sealed class MAudio : IMFrameworkModule, IDisposable'
    content.vb: Public NotInheritable Class MAudio Implements IMFrameworkModule, IDisposable
  inheritance:
