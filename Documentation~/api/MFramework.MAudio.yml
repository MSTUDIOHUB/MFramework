- uid: MFramework.MAudio.PlayBgm(MFramework.MAudioId,System.Boolean)
  commentId: M:MFramework.MAudio.PlayBgm(MFramework.MAudioId,System.Boolean)
  id: PlayBgm(MFramework.MAudioId,System.Boolean)
  parent: MFramework.MAudio
  langs:
  - csharp
  - vb
  name: PlayBgm(MAudioId, bool)
  nameWithType: MAudio.PlayBgm(MAudioId, bool)
  fullName: MFramework.MAudio.PlayBgm(MFramework.MAudioId, bool)
  type: Method
  assemblies:
  - MStudio.MFramework.Runtime
  namespace: MFramework
  summary: 使用唯一的循环 BGM AudioSource 播放已注册的 AudioClip。
  example: []
  syntax:
    content: public bool PlayBgm(MAudioId id, bool restart = false)
    parameters:
    - id: id
      type: MFramework.MAudioId
      description: 已注册 AudioClip 的 ID。
    - id: restart
      type: System.Boolean
      description: >-
        请求的 BGM 与当前 BGM 相同时是否重新开始播放。默认忽略重复请求，

        避免重新进入场景时叠加或重启音乐。
    return:
      type: System.Boolean
      description: >-
        开始或重新开始播放时返回 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>；忽略重复请求时返回

        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>。
    content.vb: Public Function PlayBgm(id As MAudioId, restart As Boolean = False) As Boolean
  overload: MFramework.MAudio.PlayBgm*
  nameWithType.vb: MAudio.PlayBgm(MAudioId, Boolean)
  fullName.vb: MFramework.MAudio.PlayBgm(MFramework.MAudioId, Boolean)
  name.vb: PlayBgm(MAudioId, Boolean)
