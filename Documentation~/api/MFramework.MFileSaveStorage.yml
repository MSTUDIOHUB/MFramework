- uid: MFramework.MFileSaveStorage.Commit(System.String,System.Byte[],System.Boolean,System.Boolean)
  commentId: M:MFramework.MFileSaveStorage.Commit(System.String,System.Byte[],System.Boolean,System.Boolean)
  id: Commit(System.String,System.Byte[],System.Boolean,System.Boolean)
  parent: MFramework.MFileSaveStorage
  langs:
  - csharp
  - vb
  name: Commit(string, byte[], bool, bool)
  nameWithType: MFileSaveStorage.Commit(string, byte[], bool, bool)
  fullName: MFramework.MFileSaveStorage.Commit(string, byte[], bool, bool)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: >-
    持久化并验证完整临时快照后一次性发布。调用方持有槽锁，且已经校验待替换主档。

    正常返回代表确定发布成功；不确定是否发布必须抛出 CommitUnknown。
  example: []
  syntax:
    content: public void Commit(string slot, byte[] snapshot, bool replaceExisting, bool preservePrevious)
    parameters:
    - id: slot
      type: System.String
      description: 槽名。
    - id: snapshot
      type: System.Byte[]
      description: 包含摘要的完整快照字节；实现不得修改此数组。
    - id: replaceExisting
      type: System.Boolean
      description: true 时必须替换现有主档，false 时必须仅创建不存在的主档。
    - id: preservePrevious
      type: System.Boolean
      description: true 时保留原有效主档为备份；恢复损坏主档时必须为 false，以保留有效备份。
    content.vb: Public Sub Commit(slot As String, snapshot As Byte(), replaceExisting As Boolean, preservePrevious As Boolean)
  overload: MFramework.MFileSaveStorage.Commit*
  exceptions:
  - type: MFramework.MSaveStorageException
    commentId: T:MFramework.MSaveStorageException
    description: 发布前故障、平台不支持或提交结果未知。
  implements:
  - MFramework.IMSaveStorage.Commit(System.String,System.Byte[],System.Boolean,System.Boolean)
  nameWithType.vb: MFileSaveStorage.Commit(String, Byte(), Boolean, Boolean)
  fullName.vb: MFramework.MFileSaveStorage.Commit(String, Byte(), Boolean, Boolean)
  name.vb: Commit(String, Byte(), Boolean, Boolean)
