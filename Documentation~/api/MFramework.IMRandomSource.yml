  - vb
  name: NextUInt()
  nameWithType: IMRandomSource.NextUInt()
  fullName: MFramework.IMRandomSource.NextUInt()
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 取得一个覆盖全部 32 位取值的无符号整数。
  example: []
  syntax:
    content: uint NextUInt()
    return:
      type: System.UInt32
      description: 范围为 [0, 4294967295]，两端均可能取得。
    content.vb: Function NextUInt() As UInteger
  overload: MFramework.IMRandomSource.NextUInt*
- uid: MFramework.IMRandomSource.NextInt(System.Int32)
  commentId: M:MFramework.IMRandomSource.NextInt(System.Int32)
  id: NextInt(System.Int32)
  parent: MFramework.IMRandomSource
  langs:
  - csharp
  - vb
  name: NextInt(int)
  nameWithType: IMRandomSource.NextInt(int)
  fullName: MFramework.IMRandomSource.NextInt(int)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 取得从零开始、均匀分布的有界整数。
  example: []
  syntax:
    content: int NextInt(int maxExclusive)
    parameters:
    - id: maxExclusive
      type: System.Int32
      description: 不包含的上界，必须大于零。
    return:
      type: System.Int32
      description: 范围为 [0, <code class="paramref">maxExclusive</code>) 的整数。
    content.vb: Function NextInt(maxExclusive As Integer) As Integer
  overload: MFramework.IMRandomSource.NextInt*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: 上界不大于零。
  nameWithType.vb: IMRandomSource.NextInt(Integer)
  fullName.vb: MFramework.IMRandomSource.NextInt(Integer)
  name.vb: NextInt(Integer)
- uid: MFramework.IMRandomSource.NextInt(System.Int32,System.Int32)
  commentId: M:MFramework.IMRandomSource.NextInt(System.Int32,System.Int32)
  id: NextInt(System.Int32,System.Int32)
  parent: MFramework.IMRandomSource
  langs:
  - csharp
  - vb
  name: NextInt(int, int)
  nameWithType: IMRandomSource.NextInt(int, int)
  fullName: MFramework.IMRandomSource.NextInt(int, int)
  type: Method
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 取得指定区间内均匀分布的整数。
  example: []
  syntax:
    content: int NextInt(int minInclusive, int maxExclusive)
    parameters:
    - id: minInclusive
      type: System.Int32
      description: 包含的下界。
    - id: maxExclusive
      type: System.Int32
      description: 不包含的上界，必须严格大于下界。
    return:
      type: System.Int32
      description: 范围为 [<code class="paramref">minInclusive</code>, <code class="paramref">maxExclusive</code>) 的整数。
    content.vb: Function NextInt(minInclusive As Integer, maxExclusive As Integer) As Integer
  overload: MFramework.IMRandomSource.NextInt*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: 上界不大于下界。
  nameWithType.vb: IMRandomSource.NextInt(Integer, Integer)
  fullName.vb: MFramework.IMRandomSource.NextInt(Integer, Integer)
  name.vb: NextInt(Integer, Integer)
