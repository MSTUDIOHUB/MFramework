  name: IMRandomSource
  nameWithType: IMRandomSource
  fullName: MFramework.IMRandomSource
  type: Interface
  assemblies:
  - MStudio.MFramework.Foundation
  namespace: MFramework
  summary: 定义可由游戏规则显式注入的非密码学随机来源。
  remarks: >-
    调用会推进该来源的内部状态。玩法与表现应持有不同实例；不要依赖全局随机状态。

    接口不要求具体算法，也不承诺任意两个实现产生相同序列。
  example: []
  syntax:
    content: public interface IMRandomSource
    content.vb: Public Interface IMRandomSource
  derivedClasses:
  - MFramework.MRandom
- uid: MFramework.IMRandomSource.NextUInt
  commentId: M:MFramework.IMRandomSource.NextUInt
  id: NextUInt
  parent: MFramework.IMRandomSource
  langs:
