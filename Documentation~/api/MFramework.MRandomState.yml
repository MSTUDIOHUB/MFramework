  namespace: MFramework
  summary: 保存一个随机流的完整状态及解释该状态所需的算法标识。
  remarks: >-
    公开字段用于显式的数据序列化；反序列化后必须交给 <xref href="MFramework.MRandom.RestoreState(MFramework.MRandomState)" data-throw-if-not-resolved="false"></xref> 校验。

    默认值不是有效状态。序列化器必须无损保存两个 64 位无符号整数，不能经由浮点数中转。

    本类型不包含游戏概率、已生成结果或命令回执，也不负责持久化提交。
  example: []
  syntax:
    content: >-
      [Serializable]

      public struct MRandomState
